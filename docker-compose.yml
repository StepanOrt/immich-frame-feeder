services:
  frameo:
    init: true
    restart: unless-stopped
    container_name: frameo
    image: ghcr.io/stepanort/immich-frame-feeder:latest
    build:
      dockerfile: Dockerfile
      context: .
    environment:
      IMMICH_URL: ${IMMICH_URL}
      IMMICH_ALBUM_ID: ${IMMICH_ALBUM_ID}
      IMMICH_API_KEY: ${IMMICH_API_KEY}
      RESOLUTION: ${RESOLUTION:-1920x1280}
      JPEG_QUALITY: ${JPEG_QUALITY:-99%}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      ALLOW_EMPTY_ALBUM: ${ALLOW_EMPTY_ALBUM:-false}
      ALLOW_MASS_DELETE: ${ALLOW_MASS_DELETE:-false}
    volumes:
      - ./ssh_config:/home/appuser/.ssh:ro
      - ${IMMICH_LIBRARY_PATH:-/mnt/pool/immich/library}:/data/upload:ro
      - ${FOTO_LIBRARY_PATH:-/mnt/pool/foto}:/data/foto:ro
